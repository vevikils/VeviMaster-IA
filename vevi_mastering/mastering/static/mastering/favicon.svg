<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg_grad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f8cff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer glowing circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg_grad)" fill-opacity="0.15" />
  
  <!-- Content -->
  <rect x="100" y="100" width="312" height="312" rx="60" fill="url(#bg_grad)" />
  
  <!-- Stylized Wave Pattern -->
  <path d="M160 300L200 220L250 320L300 180L350 260" stroke="white" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- AI Dot/Node -->
  <circle cx="300" cy="180" r="12" fill="white" filter="url(#glow)"/>
  
  <!-- Subtle V shape hidden in wave -->
</svg>
